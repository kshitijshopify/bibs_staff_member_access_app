# Render Blueprint. In Render: New > Blueprint, point it at this repo.
#
# There is no external database. Sessions live in a SQLite file on the attached
# persistent disk, so no separate DB service is needed.
#
# Two consequences of the disk, both deliberate:
#   1. A disk requires a PAID instance type — free services have an ephemeral
#      filesystem and would lose every session on each restart or spin-down.
#      Pick the instance type in the dashboard after the first sync.
#   2. A disk disables zero-downtime deploys: Render stops the old instance
#      before starting the new one, so a redeploy costs a few seconds of
#      downtime. That is the trade for not running a database.
#
# Free tier is not an option here anyway — free services sleep when idle and the
# next request takes ~1 minute, and the storefront app proxy
# (/apps/company-staff) renders inside a customer-facing page.
services:
  - type: web
    name: staff-details-access-app
    runtime: node
    # --include=dev is required: `react-router build` needs the build toolchain,
    # and Render sets NODE_ENV=production, which makes npm skip devDependencies.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /healthz
    disk:
      name: sessions
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # package.json engines: ">=20.19 <22 || >=22.12"
      - key: NODE_VERSION
        value: 22.12.0
      # Must point inside the disk mount above, or sessions do not survive.
      - key: SESSION_DB_PATH
        value: /var/data/sessions.sqlite
      # Keep in sync with the scopes line in shopify.app.toml.
      - key: SCOPES
        value: write_products,write_metaobjects,write_metaobject_definitions,read_companies,read_customers,read_users
      # Set these in the Render dashboard — never commit them.
      # SHOPIFY_APP_URL is this service's own https URL, no trailing slash.
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
