# Render Blueprint. In Render: New > Blueprint, point it at this repo.
#
# The database lives in Prisma Postgres, not on Render, so there is no
# `databases:` block here — set DATABASE_URL and DIRECT_URL from the Prisma
# Console instead.
#
# Plan and region are intentionally left out so Render does not pin you to a
# tier here — pick them in the dashboard after the first sync. Do NOT leave the
# web service on the free tier for a live merchant: free services sleep when
# idle, and the first request after that takes ~1 minute. The storefront app
# proxy (/apps/company-staff) sits in a customer-facing page, so a cold start is
# visible to buyers.
services:
  - type: web
    name: staff-details-access-app
    runtime: node
    # --include=dev is required: `react-router build` needs the build toolchain,
    # and Render sets NODE_ENV=production, which makes npm skip devDependencies.
    buildCommand: npm install --include=dev && npm run build
    # `setup` runs `prisma generate && prisma migrate deploy` — safe to repeat.
    startCommand: npm run setup && npm run start
    healthCheckPath: /healthz
    envVars:
      # package.json engines: ">=20.19 <22 || >=22.12"
      - key: NODE_VERSION
        value: 22.12.0
      # Keep in sync with the scopes line in shopify.app.toml.
      - key: SCOPES
        value: write_products,write_metaobjects,write_metaobject_definitions,read_companies,read_customers,read_users
      # Set these in the Render dashboard — never commit them.
      # DATABASE_URL: Prisma Postgres *pooled* string (pooled.db.prisma.io).
      # DIRECT_URL:   Prisma Postgres *direct* string (db.prisma.io), used by
      #               `prisma migrate deploy` on boot.
      # SHOPIFY_APP_URL: this service's own https URL, no trailing slash.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
